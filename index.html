<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real Estate Automation Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0c1a33;
      color: white;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #122447;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      background: #0f1d3a;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0b6bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    #success {
      display: none;
      background: #0b6bff;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Book a Demo</h2>
    <p>See how our automation books real estate appointments for you.</p>

    <div id="success">Success! Your request was sent.</div>

    <form id="leadForm">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="text" name="phone" placeholder="Phone Number" required />
      <input type="text" name="area" placeholder="Market Area (City or ZIP)" />
      
      <select name="team_size">
        <option value="Solo">Solo Agent</option>
        <option value="Small Team">Small Team (2–10)</option>
        <option value="Large Team">Large Team (10+)</option>
      </select>

      <textarea name="notes" rows="3" placeholder="Notes (optional)"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    const WEBHOOK = "https://hook.us2.make.com/v4fkxkdmnd4mu19novb412zmic59lvf9";
    const CALENDLY = "https://calendly.com/jacksonaddison68/new-meeting";

    const form = document.getElementById("leadForm");
    const success = document.getElementById("success");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = new FormData(form);
      
      const payload = {
        name: data.get("name"),
        email: data.get("email"),
        phone: data.get("phone"),
        area: data.get("area"),
        team_size: data.get("team_size"),
        notes: data.get("notes"),
        submitted_at: new Date().toISOString(),
        page: window.location.href
      };

      try {
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        success.style.display = "block";
        form.reset();

        // Auto-open Calendly
        window.open(CALENDLY, "_blank");

      } catch (err) {
        alert("Error sending data.");
        console.error(err);
      }
    });
  </script>

</body>
</html>
